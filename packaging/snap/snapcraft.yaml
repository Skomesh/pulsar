# Snap recipe for Pulsar — graphical audio routing manager for PulseAudio/PipeWire.
#
# Build from the repo root:
#     snapcraft --project-dir packaging/snap
# or (what the release workflow should do, so `source:` paths resolve):
#     cd packaging/snap && snapcraft pack
# `source:` paths below are relative to the directory containing THIS file,
# i.e. they are written for building with --project-dir packaging/snap.
#
# ---------------------------------------------------------------------------
# IDENTITY PLACEHOLDERS — MUST BE REPLACED BEFORE PUBLISHING
# ---------------------------------------------------------------------------
#   name:   must be globally unique in the Snap Store and must be owned by
#           the publishing account. Change `name` and every place the name
#           is echoed back (`summary`, the `common-id`, the app key, the
#           desktop filename) in one pass.
#   title / summary / description: also read by the store linter.
#   common-id: reverse-DNS desktop file id. Pick your own domain; the value
#           below is a placeholder that is NOT yours to claim.
# The store rejects uploads whose `name` is already taken; this recipe does
# not and cannot check that for you.

name: pulsar
base: core24

# core24 (Ubuntu 24.04) over core22 (22.04):
#   * Python 3.12 vs 3.10 — 3.12 is what current distros ship, so bugs found
#     in the wild are on the same interpreter family this snap bundles.
#   * noble's pipewire is newer than jammy's; `pw-dump` output shape and
#     `pw-top` fields drift between PipeWire minor releases and the app
#     parses both. Newer base = newer parsers.
#   * core24 is the current default for new snaps; core22 is in maintenance.
# Verified: jammy (core22) and noble (core24) BOTH ship python3-tk and both
# ship the pw-* binaries in `pipewire-bin` (see stage-packages comment).
version: "0.0.0-PLACEHOLDER"

summary: Graphical audio routing manager for PulseAudio and PipeWire
description: |
  Pulsar is a graphical front end for PulseAudio and PipeWire routing.

  It lists playback and capture devices, moves streams between them, and
  supports exclusive per-application routing ("output only here") so one
  app can be pinned to a device without disturbing the rest of the system.

  It drives the system's own `pactl` and `pw-*` command line tools. It does
  not ship or run an audio server: PulseAudio or PipeWire must already be
  running on the host, which is the normal case on a desktop.

grade: stable
confinement: strict
compression: lzo

license: MIT
# Store listing icon. Resolved relative to THIS file's directory
# (packaging/snap), hence the two levels up.
icon: ../../assets/icons/pulsar.svg

# `contact` is a flat string-or-list, not a mapping of named links.
contact:
  - https://github.com/Skomesh/pulsar
  - https://github.com/Skomesh/pulsar/issues

website: https://github.com/Skomesh/pulsar
source-code: https://github.com/Skomesh/pulsar

# ---------------------------------------------------------------------------
# HARDWARE ACCESS — the part that actually decides whether this snap works
# ---------------------------------------------------------------------------
# PulseAudio/PipeWire runs OUTSIDE the snap. The snap never starts, owns or
# proxies an audio server; it only opens the host's per-user socket at
# $XDG_RUNTIME_DIR/pulse/native (normally /run/user/1000/pulse/native).
#
# We use audio-playback + audio-record and deliberately do NOT use the older
# `pulseaudio` plug. Reason, checked against snapd source
# (interfaces/builtin/audio_playback.go and pulseaudio.go):
#
#   * audio-playback's AutoConnect() returns true unconditionally, and its
#     StaticInfo sets ImplicitOnClassic: true. On a classic desktop install
#     that means the plug connects with no user action and no store review
#     friction. `pulseaudio` sets deny-auto-connection: true in its base
#     declaration, so a `pulseaudio` plug is dead on arrival until a human
#     runs `snap connect`, and it is therefore rejected / requires manual
#     approval in the store.
#
#   * audio-record is what makes `pw-record` and pactl record/monitor
#     operations work. snapd grants the socket read/write on playback, but
#     the audio *service* is what checks whether the record plug is
#     connected before honouring a capture request. Without audio-record the
#     app's "Capture App Audio" feature silently degrades.
#
#   * AppArmor: audio-playback's connected-plug snippet grants exactly the
#     paths this app needs, including on classic:
#         owner /run/user/*/pulse/native rwk
#         owner /run/user/*/pulse/ r
#         owner /{,var/}run/pulse/native rwk
#     That is the socket this app connects to. No manual layout is required.
#
# On the `pulseaudio` layout / dbus `puresound` idea raised in review: neither
# is needed and both would be wrong here.
#   * snapd has no `pulseaudio` layout to reference. Layouts in current
#     snapcraft are only symlink / bind / bind-file / tmpfs (verified in the
#     snapcraft layouts reference), and /run is an explicitly DISALLOWED
#     layout target path. So a "pulseaudio layout" cannot express this.
#   * `dbus: {interface: puresound, name: org.pulseaudio.pulseaudio}` is the
#     content-snap/PulseAudio-setup-snaps mechanism. It applies to the
#     `pulseaudio` content snap used on Ubuntu Core to PROVIDE a server. A
#     desktop client that must talk to the host's already-running server
#     does not want it, and the PulseAudio setup-snaps store flow does not
#     apply to a plain audio client snap.
#
# `pipewire` plug: added because the app shells out to pw-dump/pw-top, which
# talk to the NATIVE PipeWire socket ($XDG_RUNTIME_DIR/pipewire-0), not just
# the PulseAudio protocol socket. audio-playback alone covers pactl but not
# the native pipewire socket. Verified in snapd master
# (interfaces/builtin/pipewire.go): grants
#     owner /run/user/[0-9]*/pipewire-[0-9] rw
# Caveat: this interface has deny-auto-connection: true, so it does NOT
# auto-connect. Documented in README-adjacent notes as a manual
# `snap connect pulsar:pipewire` for the PipeWire-native diagnostics view.
# pactl-based routing works without it.
plugs:
  audio-playback:
    interface: audio-playback
  audio-record:
    interface: audio-record
  pipewire:
    interface: pipewire

apps:
  pulsar:
    # The console script installed by pyproject's [project.scripts]. The
    # python plugin creates a venv in $CRAFT_PART_INSTALL, so it lands at
    # bin/pulsar inside the snap and snapcraft resolves it on $PATH.
    command: bin/pulsar
    # desktop-launch is the standard wrapper for GUI snaps: it sets up
    # XDG_RUNTIME_DIR/DISPLAY/WAYLAND_DISPLAY and XDG_DATA_DIRS so the app
    # finds its own icons and themes. It comes from the desktop content snap
    # via the desktop extension; we ship the file explicitly (see the
    # desktop-launch part) rather than depending on the `gnome` extension,
    # which would drag in a large SDK we do not otherwise need.
    command-chain:
      - snap/bin/desktop-launch
    # Desktop file id used to bind this app to an external appstream entry.
    # REPLACE with your own reverse-DNS id before publishing.
    common-id: io.github.skomesh.pulsar
    plugs:
      - audio-playback
      - audio-record
      - pipewire
      - desktop
      - desktop-legacy
      - opengl
      - wayland
      - x11
      - gsettings
    # Desktop entry installed by the desktop-entry part below. snapcraft
    # rewrites Exec to this app's name and Icon to the absolute ${SNAP} path
    # when priming, so the shipped .desktop has Exec=pulsar Icon=pulsar as
    # required, with icon lookup resolved against the primed icon tree.
    desktop: usr/share/applications/pulsar.desktop

parts:
  # ---- the application itself -------------------------------------------
  pulsar:
    plugin: python
    # Relative to this snapcraft.yaml (packaging/snap). Two levels up is the
    # repo root. `source-type: local` is required for a directory source.
    source: ../..
    source-type: local
    # No python-packages: pyproject.toml declares `dependencies = []` and the
    # app deliberately has zero runtime pip dependencies — it shells out to
    # pactl/pw-* rather than binding a Python audio library.
    stage-packages:
      # pactl. Verified: /usr/bin/pactl is in pulseaudio-utils on both jammy
      # and noble (packages.ubuntu.com filelists). __main__.py hard-fails at
      # startup if `shutil.which("pactl")` is None, so this is mandatory.
      - pulseaudio-utils

      # THE pw-* TOOLS. The brief guessed "pipewire". That is wrong on Ubuntu.
      # Verified against packages.ubuntu.com filelists for BOTH jammy and
      # noble:
      #     pipewire      -> ships only /usr/lib/systemd/user/pipewire.{service,socket}
      #     pipewire-bin  -> ships /usr/bin/pw-dump, pw-top, pw-record, pw-cli, ...
      # The Debian/Ubuntu split puts the daemon unit in `pipewire` and every
      # userland binary in `pipewire-bin`. Listing `pipewire` alone would give
      # us the daemon unit and none of the three tools the app execs.
      - pipewire-bin
      # `pipewire` is included only to pull the shared library dependencies
      # (libpipewire-0.3-0) that pipewire-bin links against.
      - pipewire

      # gdbus — optional. Used by the xdg-desktop-portal ScreenCast flow
      # (pw_app_capture.py). The app feature-detects with shutil.which("gdbus")
      # and disables the portal path when absent, so this is best-effort, not
      # required. Verified: /usr/bin/gdbus is in libglib2.0-bin.
      - libglib2.0-bin

  # ---- tkinter ------------------------------------------------------------
  # The GUI is tkinter, which lives in the base snap's Python but needs the
  # `_tkinter` C extension, which is a separate distro package. Without this
  # part the app crashes at `import tkinter` in __main__.py.
  # python3-tk installs /usr/lib/python3.X/lib-dynload/_tkinter...so plus the
  # tkinter package itself. Verified present on jammy (3.10) and noble (3.12),
  # which are core22 and core24 respectively.
  # Layout note: staging python3-tk over the base's Python works because the
  # package installs into the same interpreter prefix the base snap uses.
  tk:
    plugin: nil
    stage-packages:
      - python3-tk

  # ---- desktop-launch wrapper -------------------------------------------
  # WHY A HAND-WRITTEN WRAPPER INSTEAD OF THE STOCK ONE
  # ---------------------------------------------------
  # snapcraft's own `extensions/desktop/command-chain/desktop-launch` cannot be
  # used here: it is a 5-line shim that execs
  #     "${SNAP}/gnome-platform/command-chain/desktop-launch"
  # i.e. it only works when the gnome-platform (or kde-neon) CONTENT snap is
  # mounted, which is what the `gnome`/`kde-neon` extensions arrange. Pulling
  # in a full desktop SDK for a 200-line Tk app is not worth it, and the
  # ubuntu/snapcraft-desktop-helpers repo no longer carries a standalone
  # copy at the path the old recipes used.
  #
  # So we implement the one piece that actually matters for this app, copied
  # verbatim from snapcraft's extensions/desktop/common/desktop-exports
  # (verified present at that path in snapcraft main):
  #
  #     # Make PulseAudio socket available inside the snap-specific
  #     # $XDG_RUNTIME_DIR
  #     if [ -n "$XDG_RUNTIME_DIR" ]; then
  #         pulsenative="pulse/native"
  #         pulseaudio_sockpath="$XDG_RUNTIME_DIR/../$pulsenative"
  #         if [ -S "$pulseaudio_sockpath" ]; then
  #             export PULSE_SERVER="unix:${pulseaudio_sockpath}"
  #         fi
  #     fi
  #
  # WHY THIS IS THE WHOLE BALLGAME for snap audio:
  #   snapd gives every snap a private XDG_RUNTIME_DIR, of the form
  #       /run/user/<uid>/snap.<name>/<instance>
  #   but the host PulseAudio socket lives one level up, at
  #       /run/user/<uid>/pulse/native
  #   So `pactl`, which resolves the socket as $XDG_RUNTIME_DIR/pulse/native,
  #   looks in the snap-private directory, finds nothing, and falls back to
  #   spawning its own daemon -- which fails inside the sandbox. Exporting
  #   PULSE_SERVER to the parent-directory path is what makes the host socket
  #   reachable. The `audio-playback` AppArmor profile already permits
  #   /run/user/*/pulse/native rwk; without this env var the permission is
  #   granted but never used.
  #
  # We also point XDG_DATA_DIRS at the snap's own prefix so the icons we ship
  # in usr/share/icons are found by the Tk/icon-theme lookup.
  desktop-launch:
    plugin: nil
    override-build: |
      install -d "${CRAFT_PART_INSTALL}/snap/bin"
      cat > "${CRAFT_PART_INSTALL}/snap/bin/desktop-launch" <<'LAUNCHER'
      #!/bin/bash
      # Point PulseAudio at the HOST socket, not the snap-private one.
      # snapd gives a snap XDG_RUNTIME_DIR=/run/user/<uid>/snap.<name>/<instance>
      # while the host socket lives at /run/user/<uid>/pulse/native. Try the
      # parent-relative path first (what snapcraft's own desktop-exports does),
      # then fall back to the absolute per-user path, which is what a socket
      # layout one level shallower would produce.
      if [ -n "$XDG_RUNTIME_DIR" ]; then
          for pulseaudio_sockpath in \
              "$XDG_RUNTIME_DIR/../pulse/native" \
              "$(dirname "$XDG_RUNTIME_DIR")/pulse/native" \
              "/run/user/$(id -u)/pulse/native"
          do
              if [ -S "$pulseaudio_sockpath" ]; then
                  export PULSE_SERVER="unix:$pulseaudio_sockpath"
                  break
              fi
          done
      fi

      # Native PipeWire socket lives in the snap-private runtime dir too.
      # pipewire clients resolve it via PIPEWIRE_REMOTE, so set it explicitly.
      if [ -n "$XDG_RUNTIME_DIR" ]; then
          for candidate in "$XDG_RUNTIME_DIR"/pipewire-[0-9]*; do
              if [ -S "$candidate" ]; then
                  export PIPEWIRE_REMOTE="$candidate"
                  break
              fi
          done
      fi

      # Let the app find the icons we installed under $SNAP/usr/share.
      export XDG_DATA_DIRS="${SNAP}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"

      exec "$@"
      LAUNCHER
      chmod 0755 "${CRAFT_PART_INSTALL}/snap/bin/desktop-launch"

  # ---- .desktop entry ----------------------------------------------------
  # The repo's pulsar.desktop is a TEMPLATE: its Exec line is the literal
  # string PLACEHOLDER_EXEC_PATH, which install.sh rewrites at install time.
  # Shipping it unmodified would produce a launcher that execs a file named
  # "PLACEHOLDER_EXEC_PATH". So we synthesise a clean copy here with the
  # required Exec=pulsar / Icon=pulsar and install that instead.
  # (snapcraft then rewrites Exec to the app name and resolves Icon against
  # the primed icon tree; the authored values below are the required ones.)
  desktop-entry:
    plugin: nil
    override-build: |
      install -d "${CRAFT_PART_INSTALL}/usr/share/applications"
      cat > "${CRAFT_PART_INSTALL}/usr/share/applications/pulsar.desktop" <<'DESKTOP'
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=Pulsar
      GenericName=Audio Routing
      Comment=Graphical audio routing manager for PulseAudio and PipeWire
      Exec=pulsar
      Icon=pulsar
      Terminal=false
      Categories=AudioVideo;Audio;Settings;Mixer;
      Keywords=sound;audio;volume;pulseaudio;pipewire;routing;loopback;mixer;streamer;
      StartupNotify=true
      DESKTOP
      install -d "${CRAFT_PART_INSTALL}/usr/share/metainfo"
      # Desktop files are resolved by name, so the icons must be reachable
      # through a theme search path. Both the scalable SVG and the PNG rasters
      # are installed: SVG for HiDPI-correct rendering, PNGs for panels,
      # launchers and toolkits that ignore SVG.
      for size in 16 24 32 48 64 128 256 512; do
        install -D -m 0644 \
          "${CRAFT_PROJECT_DIR}/../../assets/icons/pulsar-${size}.png" \
          "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/${size}x${size}/apps/pulsar.png"
      done
      install -D -m 0644 \
        "${CRAFT_PROJECT_DIR}/../../assets/icons/pulsar.svg" \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/scalable/apps/pulsar.svg"
      # appdata is optional; emitted only if present so a missing file does not
      # fail the build. Not currently in the repo.
      if [ -f "${CRAFT_PROJECT_DIR}/../../assets/metainfo/io.github.skomesh.pulsar.metainfo.xml" ]; then
        install -D -m 0644 \
          "${CRAFT_PROJECT_DIR}/../../assets/metainfo/io.github.skomesh.pulsar.metainfo.xml" \
          "${CRAFT_PART_INSTALL}/usr/share/metainfo/io.github.skomesh.pulsar.metainfo.xml"
      fi