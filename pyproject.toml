[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar"
version = "0.1.0"
description = "Graphical audio routing manager for PulseAudio/PipeWire"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Skomesh"},
]
keywords = [
    "audio",
    "pulseaudio",
    "pipewire",
    "routing",
    "streamer",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0",
]

[project.scripts]
pulsar = "main:main"

[project.urls]
Homepage = "https://github.com/Skomesh/pulsar"
Issues = "https://github.com/Skomesh/pulsar/issues"
Source = "https://github.com/Skomesh/pulsar"

[tool.setuptools]
# main.py is a top-level module, not a package, so automatic package
# discovery skips it -- which left the declared `pulsar = main:main` entry
# point unresolvable after a real install. Name it explicitly.
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# builtin_profiles.json is read at runtime by utils/profile_manager.py.
# Without this the wheel ships no preset data and the app silently starts
# with an empty profile list. Data lives in the package dir so it resolves
# from an installed wheel, not just a source checkout.
utils = ["presets/*.json"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]