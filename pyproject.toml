[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar"
version = "0.1.0"
description = "Graphical audio routing manager for PulseAudio/PipeWire"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "Skomesh"},
]
keywords = [
    "audio",
    "pulseaudio",
    "pipewire",
    "routing",
    "streamer",
    "linux",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
    "Environment :: X11 Applications :: GTK",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0",
]

[project.scripts]
pulsar = "main:main"

[project.gui-scripts]
pulsar-gui = "main:main"

[project.urls]
Homepage = "https://github.com/skomesh/pulsar"
Issues = "https://github.com/skomesh/pulsar/issues"
Source = "https://github.com/skomesh/pulsar"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
# py-modules is required in addition to packages: main.py is the module the
# `pulsar` console script points at, and packages.find only discovers
# packages (directories with __init__.py). Without this the installed script
# dies with "ModuleNotFoundError: No module named 'main'".
py-modules = ["main"]


[tool.setuptools.packages.find]
where = ["src"]

# The starter profiles live in presets/ at the repo root, but the packages
# are found under src/. Without this they are excluded from the wheel and the
# built-in profile list silently comes up empty on every real install.
[tool.setuptools.package-data]
"*" = ["presets/*.json"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
