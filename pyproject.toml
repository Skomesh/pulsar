[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar"
version = "0.1.0"
description = "Graphical audio routing manager for PulseAudio/PipeWire"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Skomesh"},
]
keywords = [
    "audio",
    "pulseaudio",
    "pipewire",
    "routing",
    "streamer",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0",
]

[project.scripts]
# `pulsar` is the command-line interface; the GUI is `pulsar-gui`. The
# desktop entry, every packaging recipe and install.sh all point at
# pulsar-gui, so a rename here without those updates installs cleanly and
# launches nothing.
pulsar = "pulsar.cli:cli_main"
pulsar-gui = "pulsar.__main__:main"

[project.urls]
Homepage = "https://github.com/Skomesh/pulsar"
Issues = "https://github.com/Skomesh/pulsar/issues"
Source = "https://github.com/Skomesh/pulsar"

[tool.setuptools.packages.find]
# Only ship the `pulsar` package. Automatic discovery used to also install
# `utils`, `ui` and `config` as top-level modules, because those were the
# directory names under src/. That is fine for `pip install` into a venv and
# actively harmful for a deb or rpm, which drop them into the system
# dist-packages where they collide with every other package that ships a
# `utils` or `config` module -- and whichever loses the import race silently
# breaks the other program.
where = ["src"]
include = ["pulsar*"]

[tool.setuptools.package-data]
# builtin_profiles.json is read at runtime by utils/profile_manager.py.
# Without this the wheel ships no preset data and the app silently starts
# with an empty profile list. Data lives in the package dir so it resolves
# from an installed wheel, not just a source checkout.
"pulsar.utils" = ["presets/*.json"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]